<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팔레트 스와치 — palette_v1</title>
<!--
  팔레트 스와치 뷰어. assets/rules/palette_v1.json 을 fetch 해서 그린다. 색 값을 여기에 박지 않는다.
  색 계산 없음. 허용된 유일한 계산은 저장된 Lab 의 극좌표 표기 C* = sqrt(a²+b²), h° = atan2(b, a) (CONTRACT §3, COLOR_SPEC §6).
  배색 로직 없음. 결과 뷰어(index.html)와는 별개 파일.
  열기: 프로젝트 루트에서 `python -m http.server 8000` → http://localhost:8000/prototype/palette.html (수동 새로고침)
-->
<style>
  :root { --fg:#1d1d1f; --fg2:#555; --line:rgba(0,0,0,.18); --panel:rgba(255,255,255,.86); }
  body.dark { --fg:#f2f2f2; --fg2:#cfcfcf; --line:rgba(255,255,255,.28); --panel:rgba(0,0,0,.38); }
  html, body { margin:0; }
  body { font-family: system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color:var(--fg); background:#fff; padding:20px 24px 48px; transition: background .2s; }
  h1 { font-size:18px; margin:0 0 4px; } h2 { font-size:14px; margin:28px 0 10px; color:var(--fg2); font-weight:600; }
  .meta { font-size:12.5px; color:var(--fg2); }
  .bar { position:sticky; top:0; z-index:2; background:var(--panel); backdrop-filter: blur(4px); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:14px 0 6px; display:flex; flex-wrap:wrap; gap:14px 22px; font-size:13px; align-items:center; }
  .bar .grp { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .bar .lbl { color:var(--fg2); margin-right:2px; }
  .bar button { font:inherit; font-size:12.5px; padding:4px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); cursor:pointer; }
  .bar button.on { background:var(--fg); color:#fff; border-color:var(--fg); }
  body.dark .bar button.on { color:#111; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
  .sw { border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:11.5px; line-height:1.4; }
  .sw .c { height:84px; position:relative; }
  .sw .c .tag { position:absolute; right:6px; top:6px; font-size:10.5px; padding:1px 6px; border-radius:10px; background:rgba(255,255,255,.85); color:#333; border:1px solid rgba(0,0,0,.15); }
  .sw .t { padding:6px 8px 7px; background:var(--panel); }
  .sw .t b { font-size:12.5px; } .sw .t code { font-size:11px; color:var(--fg2); }
  .sw.neutral { outline:2px solid var(--fg); outline-offset:-2px; }
  .axis { position:relative; height:26px; margin:6px 0 2px; border-top:1px solid var(--line); }
  .axis span { position:absolute; top:3px; transform:translateX(-50%); font-size:11px; color:var(--fg2); }
  .axis span::before { content:""; position:absolute; left:50%; top:-4px; width:1px; height:4px; background:var(--line); }
  .row { position:relative; height:78px; border-left:1px solid var(--line); border-right:1px solid var(--line); background: linear-gradient(90deg, #000, #fff); background-size:100% 3px; background-repeat:no-repeat; background-position:0 100%; margin-bottom:8px; }
  .row .rl { position:absolute; left:8px; top:4px; font-size:12px; color:var(--fg2); }
  .row .dot { position:absolute; bottom:8px; width:14px; height:14px; border-radius:50%; border:1.5px solid var(--line); transform:translateX(-50%); box-shadow:0 0 0 1px rgba(255,255,255,.6); }
  .row .dot:hover { z-index:3; transform:translateX(-50%) scale(1.35); }
  .row .dot i { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); white-space:nowrap; font-size:10px; font-style:normal; color:var(--fg); background:var(--panel); padding:0 4px; border-radius:3px; display:none; }
  .row .dot:hover i { display:block; }
  .err { border:1px solid #c33; background:#fff3f3; color:#611; padding:12px 14px; border-radius:8px; font-size:13px; white-space:pre-wrap; margin-top:14px; }
  .small { font-size:12px; color:var(--fg2); margin-top:6px; }
</style>
</head>
<body>
<h1>팔레트 스와치 <span class="meta" id="meta"></span></h1>
<div class="meta">데이터: <code>assets/rules/palette_v1.json</code> (fetch, 새로고침으로 반영). 굵은 테두리·태그 = <code>neutral</code>. C*·h°는 저장된 Lab의 극좌표 표기.</div>

<div class="bar">
  <div class="grp"><span class="lbl">정렬</span>
    <button data-sort="hue" class="on">계열별 (h°)</button>
    <button data-sort="light">명도순 (L*)</button>
    <button data-sort="neutral">neutral 먼저</button>
  </div>
  <div class="grp"><span class="lbl">배경</span>
    <!-- UI 프리셋. 팔레트 데이터가 아님. 피부톤 가정치는 COLOR_SPEC §1.2 로 L*/C*/h → hex 계산: (78,18,60) (62,24,58) (45,26,55) (30,20,52) -->
    <button data-bg="#DCBAA4">피부 L*78</button>
    <button data-bg="#B88D73">피부 L*62</button>
    <button data-bg="#8D6048">피부 L*45</button>
    <button data-bg="#603F2F">피부 L*30</button>
    <button data-bg="#FFFFFF" class="on">흰색</button>
    <button data-bg="#808080">회색</button>
  </div>
</div>

<div id="err" class="err" hidden></div>

<h2>스와치</h2>
<div id="grid" class="grid"></div>

<h2>명도 분포 (L*)</h2>
<div id="dist"></div>
<div class="small">점에 마우스를 올리면 id가 보인다. 가까운 값은 위로 겹쳐 쌓인다. 빈 구간이 비어 있는 명도대다.</div>

<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  const state = { colors: [], sort: "hue" };

  // 허용된 유일한 계산: Lab 극좌표 (COLOR_SPEC §1.2 "Lab → LCh"). 색 공간 변환은 하지 않는다.
  function polar(lab) {
    const C = Math.hypot(lab.a, lab.b);
    let h = Math.atan2(lab.b, lab.a) * 180 / Math.PI;
    if (h < 0) h += 360;
    return { C, h };
  }

  function fail(msg) {
    const e = $("#err"); e.hidden = false; e.textContent = msg;
  }

  function validate(doc) {
    const problems = [];
    if (!doc || doc.schema !== "palette") problems.push("schema 가 'palette' 가 아님");
    if (!Array.isArray(doc.colors)) { problems.push("colors 배열 없음"); return problems; }
    doc.colors.forEach((c, i) => {
      const p = `colors[${i}]`;
      if (typeof c.id !== "string" || !c.id) problems.push(`${p}.id 없음`);
      if (typeof c.nameKo !== "string") problems.push(`${p}.nameKo 없음`);
      if (typeof c.hex !== "string" || !/^#[0-9A-F]{6}$/.test(c.hex)) problems.push(`${p}.hex 형식 오류: ${c.hex}`);
      if (!c.lab || ["L", "a", "b"].some(k => typeof c.lab[k] !== "number")) problems.push(`${p}.lab 형식 오류`);
      if (!Array.isArray(c.tags)) problems.push(`${p}.tags 배열 없음`);
    });
    return problems;
  }

  function sorted(list, mode) {
    const byId = (x, y) => x.id < y.id ? -1 : x.id > y.id ? 1 : 0;
    const hueKey = (x, y) => (x.h - y.h) || (y.lab.L - x.lab.L) || byId(x, y);
    const lightKey = (x, y) => (y.lab.L - x.lab.L) || byId(x, y);
    const arr = list.slice();
    if (mode === "light") return arr.sort(lightKey);
    if (mode === "neutral") return arr.sort((x, y) => (y.neutral - x.neutral) || (x.neutral ? lightKey(x, y) : hueKey(x, y)));
    return arr.sort(hueKey);
  }

  function renderGrid() {
    const g = $("#grid"); g.textContent = "";
    for (const c of sorted(state.colors, state.sort)) {
      const el = document.createElement("div");
      el.className = "sw" + (c.neutral ? " neutral" : "");
      el.innerHTML =
        `<div class="c" style="background:${c.hex}">${c.neutral ? '<span class="tag">neutral</span>' : ""}</div>` +
        `<div class="t"><b></b><br><code></code> <code></code><br>L* ${c.lab.L.toFixed(1)} · C* ${c.C.toFixed(1)} · h° ${c.h.toFixed(0)}</div>`;
      const t = el.querySelectorAll(".t b, .t code");
      t[0].textContent = c.nameKo; t[1].textContent = c.id; t[2].textContent = c.hex;
      g.appendChild(el);
    }
  }

  function renderDist() {
    const d = $("#dist"); d.textContent = "";
    const axis = document.createElement("div"); axis.className = "axis";
    for (let L = 0; L <= 100; L += 10) { const s = document.createElement("span"); s.style.left = L + "%"; s.textContent = L; axis.appendChild(s); }
    const rows = [["neutral", state.colors.filter(c => c.neutral)], ["유채색", state.colors.filter(c => !c.neutral)]];
    for (const [label, list] of rows) {
      const row = document.createElement("div"); row.className = "row";
      const rl = document.createElement("span"); rl.className = "rl"; rl.textContent = `${label} (${list.length})`; row.appendChild(rl);
      const byL = list.slice().sort((x, y) => (x.lab.L - y.lab.L) || (x.id < y.id ? -1 : 1));
      // 가까운 값(L* 차 2 미만)은 한 칸씩 위로 쌓는다. 결정론적.
      const placed = [];
      for (const c of byL) {
        const lane = placed.filter(p => c.lab.L - p.L < 2).length;
        placed.push({ L: c.lab.L });
        const dot = document.createElement("span"); dot.className = "dot";
        dot.style.left = c.lab.L + "%"; dot.style.bottom = (8 + lane * 16) + "px"; dot.style.background = c.hex;
        dot.title = `${c.id} · ${c.nameKo} · L* ${c.lab.L.toFixed(1)}`;
        const i = document.createElement("i"); i.textContent = `${c.id} ${c.lab.L.toFixed(1)}`; dot.appendChild(i);
        row.appendChild(dot);
      }
      d.appendChild(row);
    }
    d.appendChild(axis);
  }

  function setBg(hex) {
    document.body.style.background = hex;
    // 배경 밝기에 따라 글자색 반전 (표시용 근사. 색 계산이 아니라 UI 대비 판단)
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    document.body.classList.toggle("dark", (0.2126 * r + 0.7152 * g + 0.0722 * b) < 120);
  }

  document.querySelectorAll("[data-sort]").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll("[data-sort]").forEach(b => b.classList.toggle("on", b === btn));
    state.sort = btn.dataset.sort; renderGrid();
  }));
  document.querySelectorAll("[data-bg]").forEach(btn => btn.addEventListener("click", () => {
    document.querySelectorAll("[data-bg]").forEach(b => b.classList.toggle("on", b === btn));
    setBg(btn.dataset.bg);
  }));

  fetch("../assets/rules/palette_v1.json", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}`); return r.json(); })
    .then(doc => {
      const problems = validate(doc);
      if (problems.length) { fail("palette_v1.json 형식 문제:\n- " + problems.join("\n- ")); return; }
      state.colors = doc.colors.map(c => Object.assign({}, c, polar(c.lab), { neutral: c.tags.includes("neutral") }));
      const n = state.colors.length, nn = state.colors.filter(c => c.neutral).length;
      $("#meta").textContent = `— ${doc.schema} v${doc.version} · ${n}색 (neutral ${nn}, 유채색 ${n - nn})`;
      renderGrid(); renderDist();
    })
    .catch(e => fail(
      "팔레트 JSON을 읽지 못했다: " + e.message +
      "\n\n이 페이지는 fetch 를 쓰므로 file:// 로 열면 동작하지 않는다." +
      "\n프로젝트 루트에서  python -m http.server 8000  을 실행하고" +
      "\nhttp://localhost:8000/prototype/palette.html 로 여시오."));
})();
</script>
</body>
</html>
